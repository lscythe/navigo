name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  merge_group:
  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096M
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache.parallel=false

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shared tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Run tests
        run: ./gradlew test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 3

  android:
    name: Android
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Build staging APK
        run: ./gradlew :app:android:assembleStagingGoogleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-apk
          path: app/android/build/outputs/apk/stagingGoogle/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Package Desktop application
        run: ./gradlew :app:desktop:packageDistributionForCurrentOS
      - name: Upload Desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-${{ matrix.os }}
          path: app/desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS Simulator
    if: ${{ false }}
    runs-on: macos-15
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Build iOS Simulator application
        run: |
          xcodebuild build \
            -project app/ios/iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -scheme iosApp \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS Simulator application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 3

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Generate coverage
        run: ./gradlew koverXmlReport
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/build/reports/kover/**/*.xml'
          fail_ci_if_error: true

  dependency-review:
    name: Dependency vulnerability and license check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
