name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  merge_group:
  workflow_dispatch:

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096M
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache.parallel=false

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  bot-policy:
    name: Bot PR policy
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      contents: read
    outputs:
      weblate_translation_only: ${{ steps.classify.outputs.weblate_translation_only || 'false' }}
    steps:
      - name: Check out trusted base repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Classify translation-only Weblate PR
        id: classify
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          files_file="$RUNNER_TEMP/changed-files"
          gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > "$files_file"
          python3 - "$PR_AUTHOR" "$files_file" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          author, filename = sys.argv[1], sys.argv[2]
          pattern = re.compile(r"^(?:core|feature|app)/[^/]+(?:/[^/]+)*/src/[^/]+/composeResources/values(?:-[A-Za-z0-9-]+)?/strings\.xml$")
          with open(filename, encoding="utf-8") as input_file:
              paths = [line.rstrip("\n") for line in input_file if line.strip()]
          allowed = lambda path: path == "id.tbx" or (not any(ord(char) < 32 for char in path) and ".." not in path.split("/") and pattern.fullmatch(path) is not None)
          print(f"weblate_translation_only={str(author == 'app/hosted-weblate' and bool(paths) and all(allowed(path) for path in paths)).lower()}")
          PY
      - name: Keep normal policy for non-PR event
        id: non-pr
        if: github.event_name != 'pull_request'
        run: echo 'weblate_translation_only=false' >> "$GITHUB_OUTPUT"
  test:
    needs: bot-policy
    if: needs.bot-policy.outputs.weblate_translation_only != 'true'
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Run tests
        run: ./gradlew test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 3

  android:
    name: Build
    runs-on: ubuntu-24.04
    needs: [bot-policy, test]
    if: needs.test.result == 'success' && needs.bot-policy.outputs.weblate_translation_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Build staging APK
        run: ./gradlew :app:android:assembleStagingGoogleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-apk
          path: app/android/build/outputs/apk/stagingGoogle/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [bot-policy, test]
    if: needs.test.result == 'success' && needs.bot-policy.outputs.weblate_translation_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Package Desktop application
        run: ./gradlew :app:desktop:packageDistributionForCurrentOS
      - name: Display Desktop packaging logs
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          logs=(app/desktop/build/compose/logs/createDistributable/*.txt)
          if (( ${#logs[@]} == 0 )); then
            echo "No createDistributable logs found."
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Upload Desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-${{ matrix.os }}
          path: app/desktop/build/compose/binaries/main/**
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS Simulator
    runs-on: macos-15
    needs: [bot-policy, test]
    if: needs.test.result == 'success' && needs.bot-policy.outputs.weblate_translation_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Generate iOS version configuration
        run: ./gradlew :app:ios:generateIosVersionConfig --console=plain
      - name: Build iOS Simulator application
        run: |
          xcodebuild build \
            -project app/ios/iosApp/iosApp.xcodeproj \
            -configuration Debug \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS Simulator application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 3

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: [bot-policy, test]
    if: needs.test.result == 'success' && needs.bot-policy.outputs.weblate_translation_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Gradle
        uses: ./.github/actions/gradle-setup
      - name: Generate coverage
        run: ./gradlew koverXmlReportDesktop -PnavigoCoverage --console=plain --no-daemon
      - name: Collect coverage reports
        id: coverage-reports
        shell: bash
        run: |
          files=$(find . -path '*/build/reports/kover/reportDesktop.xml' -type f -size +0c -print | sort | paste -sd, -)
          if [[ -z "$files" ]]; then
            echo 'No non-empty Kover XML reports were generated.' >&2
            exit 1
          fi
          printf 'files=%s\n' "$files" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage-reports.outputs.files }}
          fail_ci_if_error: true
          disable_search: true

  translation-validation:
    name: Translation validation
    needs: bot-policy
    if: needs.bot-policy.outputs.weblate_translation_only == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted validation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Validate changed translation data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/translation-data"
          manifest="$RUNNER_TEMP/translation-manifest"
          gh api --paginate "/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"
          python3 - "$RUNNER_TEMP/pr-files.json" "$manifest" "$RUNNER_TEMP/translation-data" "$REPOSITORY" "$HEAD_SHA" <<'PY'
          import base64, json, pathlib, subprocess, sys
          sys.path.insert(0, ".github/scripts")
          from classify_bot_pr import is_translation_path
          records = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest, root = pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3]).resolve()
          repo, ref = sys.argv[4], sys.argv[5]
          with manifest.open("w", encoding="utf-8") as output:
              for record in records:
                  status = record["status"]
                  name = record["filename"]
                  if status not in {"added", "modified"}:
                      raise SystemExit(f"Unsupported changed-file status: {status} {name}")
                  if not is_translation_path(name) or any(ord(char) < 32 for char in name):
                      raise SystemExit(f"Invalid translation filename: {name!r}")
                  target = (root / name).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"Translation path escapes data directory: {name!r}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  content = subprocess.check_output(["gh", "api", f"/repos/{repo}/contents/{name}?ref={ref}", "--jq", ".content"])
                  target.write_bytes(base64.b64decode(content))
                  output.write(f"{name}\t{target}\n")
          PY
          PYTHONPATH=.github/scripts python3 .github/scripts/validate_translations.py "$manifest"

  dependency-review:
    name: Dependency vulnerability and license check
    needs: bot-policy
    if: github.event_name == 'pull_request' && needs.bot-policy.outputs.weblate_translation_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
