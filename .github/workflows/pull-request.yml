name: Pull Request Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read
  contents: read

jobs:
  validate:
    name: Validate PR template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          headings = [
              "Summary",
              "Related issue",
              "Specification",
              "Acceptance criteria",
              "Verification",
              "Review checklist",
          ]

          for heading in headings:
              if not re.search(rf"(?m)^##\s+{re.escape(heading)}\s*$", body):
                  raise SystemExit(f"Missing required section: ## {heading}")

          match = re.search(
              r"(?ms)^##\s+Acceptance criteria\s*$"
              r"(.*?)(?=^##\s+|\Z)",
              body,
          )
          if not match or not re.search(r"(?m)^-\s+\[[ xX]\]\s+\S", match.group(1)):
              raise SystemExit(
                  "Acceptance criteria must contain a checkbox with criterion text."
              )
          PY
