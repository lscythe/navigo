name: Feature request
description: Propose a user-facing improvement
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: External specification
      description: Link the relevant FSD, TSD, or design decision.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android
        - iOS
        - Desktop JVM
        - Web
        - Shared Kotlin Multiplatform
        - Backend
        - Design system
        - Other
    validations:
      required: true
