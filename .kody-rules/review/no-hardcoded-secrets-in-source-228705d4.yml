title: No hardcoded secrets in source
rule: >-
  Never commit API keys, auth tokens, passwords, or other secrets as string
  literals in Kotlin source. Use BuildKonfig configuration or
  environment-provided values instead.
severity: critical
scope: file
path: '**/*'
examples:
  - snippet: val apiKey = BuildKonfig.API_KEY
    isCorrect: true
  - snippet: val apiKey = "sk_live_1234567890abcdef"
    isCorrect: false
inheritance:
  inheritable: true
  exclude: []
  include: []
