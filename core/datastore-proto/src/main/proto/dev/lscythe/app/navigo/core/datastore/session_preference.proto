syntax = "proto3";

option java_package = "dev.lscythe.app.navigo.core.datastore";
option java_multiple_files = true;

message SessionPreference {
  string id = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 access_expires_at_epoch_seconds = 4;
  int64 refresh_expires_at_epoch_seconds = 5;
  string installation_id = 6;
}
